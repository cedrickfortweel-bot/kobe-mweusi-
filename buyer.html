<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buyer — Kobe Mweusi</title>
  <style>
    :root {
      --bg: #091113;
      --panel: #121d20;
      --panel-2: #182427;
      --line: #264047;
      --text: #ebf6f8;
      --muted: #abc0c4;
      --green: #4cd6a1;
      --red: #ff7f73;
      --shadow: rgba(0,0,0,.28);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, Arial, sans-serif; }
    body { display: flex; min-height: 100vh; }
    .sidebar { width: 250px; background: var(--panel); border-right: 1px solid var(--line); padding: 18px 14px; }
    .brand { font-size: 24px; font-weight: 800; padding: 10px 8px 18px; border-bottom: 1px solid var(--line); }
    .nav { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
    .nav button { width: 100%; text-align: left; background: transparent; color: var(--text); border: 1px solid transparent; border-radius: 10px; padding: 12px 10px; font-size: 14px; cursor: pointer; }
    .nav button:hover { background: rgba(255,255,255,0.02); border-color: var(--line); }
    .main { flex: 1; padding: 28px; }
    .title { font-size: 30px; font-weight: 800; margin-bottom: 20px; }
    .card { background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: 0 12px 28px var(--shadow); }
    .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: none; }
    .label { color: var(--muted); }
    .danger { color: var(--red); }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">Kobe Mweusi</div>
    <nav class="nav">
      <button>Home</button>
      <button>Orders</button>
      <button>Wishlist</button>
      <button>Messages</button>
      <button>Account settings</button>
      <button class="danger" id="logoutBtn">Log out</button>
    </nav>
  </aside>

  <main class="main">
    <div class="title">Buyer dashboard</div>
    <div class="card">
      <div class="row"><span class="label">Orders</span><span>12</span></div>
      <div class="row"><span class="label">Saved items</span><span>14</span></div>
      <div class="row"><span class="label">Wallet</span><span>TSh 250K</span></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = 'https://YOUR_PROJECT_REF.supabase.co';
    const supabaseKey = 'YOUR_ANON_KEY';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    (async function () {
      const { data: { user }, error } = await supabase.auth.getUser();
      if (error || !user) {
        window.location.href = 'index.html';
        return;
      }

      const { data: profile } = await supabase
        .from('profiles')
        .select('role')
        .eq('id', user.id)
        .single();

      if (!profile || profile.role !== 'buyer') {
        window.location.href = 'index.html';
      }
    })();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
