name: Deploy wallet and escrow functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/wallet/**"
      - "supabase/functions/escrow/**"
      - "supabase/functions/_shared/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check deployment credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN to the repository Actions secrets."
            exit 1
          fi

      - name: Deploy wallet function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@latest functions deploy wallet --project-ref spoylutxxxfovcuflyts --yes

      - name: Deploy escrow function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@latest functions deploy escrow --project-ref spoylutxxxfovcuflyts --yes
