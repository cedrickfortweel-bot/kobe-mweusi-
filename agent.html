      scanRecorded: 'Makabidhiano yamerekodiwa.',
      scanReleased: 'Makabidhiano yamerekodiwa na malipo yamefunguliwa.',
      scanWindow: 'Makabidhiano yamerekodiwa. Malipo yatafunguliwa baada ya kipindi cha uthibitisho.',
      scanFailed: 'Skani haikukubaliwa.',
      noHistory: 'Hakuna skani zilizorekodiwa bado.',
      scanLabel: 'Risiti ya kifurushi',
      toolMessage: 'Zana hii itaunganishwa na backend ya wakala katika hatua inayofuata.',
      notAnAgent: 'Akaunti hii si ya wakala wa uwasilishaji.',
      assignmentsEmpty: 'Hakuna oda zilizokaguliwa kwako kwa sasa.',
      noNotifications: 'Hakuna arifa bado.',
      currentPassword: 'Nenosiri la sasa',
      newPassword: 'Nenosiri jipya',
      confirmPassword: 'Thibitisha nenosiri jipya',
      changePassword: 'Badili nenosiri',
      savePassword: 'Hifadhi nenosiri',
      passwordChanged: 'Nenosiri lako limebadilishwa.',
      supportTopic: 'Ni mada gani?',
      supportMessage: 'Mwele uendeshaji kilichotokea',
      send: 'Tuma',
      supportSent: 'Uendeshaji umepokea ombi lako.',
      supportHint: 'Weka namba ya oda na wakati wa skani.',
      cancel: 'Ghairi',
    },
  };

  let lang = 'en';
  let stream = null;
  let scanTimer = null;
  let busy = false;
  let scans = [];
  let notifications = [];

  const $ = id => document.getElementById(id);
  const t = key => (L[lang] && L[lang][key]) || L.en[key] || key;
  const show = id => $(id).classList.remove('is-hidden');
  const hide = id => $(id).classList.add('is-hidden');

  /* The hub cannot work without the backend: the server decides who the
     agent is, whether a code is good and whether the money moved. */
  if (!window.KobeApi) {
    apply();
    const banner = $('auth-message');
    if (banner) {
      banner.textContent = 'The Kobe Mweusi service is not available right now. Please reload the page.';
      banner.dataset.tone = 'error';
    }
    return;
  }

  function msg(id, key, tone) {
    const el = $(id);
    if (!el) return;
    el.textContent = t(key);
    el.dataset.tone = tone || '';
  }

  function say(id, text, tone) {
    const el = $(id);
    if (!el) return;
    el.textContent = text;
    el.dataset.tone = tone || '';
  }

  /* ---------------- notifications ---------------- */
  function notificationRender() {
    const list = $('agent-notifications');
    if (!list) return;
    list.replaceChildren();
    if (!notifications.length) {
      const empty = document.createElement('p');
      empty.className = 'empty-state';
      empty.textContent = t('noNotifications');
      list.append(empty);
    } else {
      notifications.forEach(note => {
        const row = document.createElement('div');
        const icon = document.createElement('span');
        const body = document.createElement('span');
        const title = document.createElement('b');
        const detail = document.createElement('small');
        row.className = 'history-row';
        icon.className = 'history-icon';
        icon.textContent = '!';
        title.textContent = note.title;
        detail.textContent = note.body + ' · ' + note.time;
        body.append(title, detail);
        row.append(icon, body);
        list.append(row);
      });
    }
    const count = $('notification-count');
    if (count) count.textContent = notifications.length + ' new';
  }

  async function loadNotifications() {
    if (!api() || typeof KobeApi.listNotifications !== 'function') return;
    try {
      const rows = await KobeApi.listNotifications(30);
      notifications = (rows || []).map(row => ({
        title: row.title || '',
        body: row.body || '',
        time: new Date(row.created_at).toLocaleString(),
      }));
      notificationRender();
    } catch (error) {
      console.warn('agent notifications', error);
    }
  }

  /* ---------------- scan history ---------------- */
  function historyRender() {
    const list = $('history');
    if (!list) return;
    list.replaceChildren();
    if (!scans.length) {
      const empty = document.createElement('p');
      empty.className = 'empty-state';
      empty.textContent = t('noHistory');
      list.append(empty);
    } else {
      scans.forEach(scan => {
        const row = document.createElement('div');
        const icon = document.createElement('span');
        const text = document.createElement('span');
        const title = document.createElement('b');
        const detail = document.createElement('small');
        row.className = 'history-row';
        icon.className = 'history-icon';
        icon.textContent = '✓';
        title.textContent = scan.order_ref || t('scanLabel');
        detail.textContent = [scan.item_name, scan.stage, scan.time].filter(Boolean).join(' · ');
        text.append(title, detail);
        row.append(icon, text);
        list.append(row);
      });
    }
  }

  function assignmentRender(assignments) {
    const list = $('assignments');
    if (!list) return;
    list.replaceChildren();
    const rows = assignments || [];
    const count = $('assignment-count');
    if (count) count.textContent = String(rows.length);
    if (!rows.length) {
      const empty = document.createElement('p');
      empty.className = 'empty-state';
      empty.textContent = t('assignmentsEmpty');
      list.append(empty);
      return;
    }
    rows.forEach(row => {
      const item = document.createElement('div');
      const icon = document.createElement('span');
      const text = document.createElement('span');
      const title = document.createElement('b');
      const detail = document.createElement('small');
      item.className = 'history-row';
      icon.className = 'history-icon';
      icon.textContent = '▣';
      title.textContent = row.order_ref || '';
      detail.textContent = [row.item_name, row.stage, row.order_status].filter(Boolean).join(' · ');
      text.append(title, detail);
      item.append(icon, text);
      list.append(item);
    });
  }

  function apply() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    historyRender();
    notificationRender();
  }

  /* ---------------- the camera ---------------- */
  function stop() {
    const frame = $('scan-frame');
    if (frame) frame.classList.remove('is-detecting');
    if (scanTimer) cancelAnimationFrame(scanTimer);
    scanTimer = null;
    busy = false;
    if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
    const video = $('scan-video');
    if (video) video.srcObject = null;
  }

  async function start() {
    if (!navigator.onLine) { msg('scan-status', 'offlineScan', 'error'); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      msg('scan-status', 'cameraUnsupported', 'error');
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 720 }, height: { ideal: 720 } },
        audio: false,
      });
      const video = $('scan-video');
      video.srcObject = stream;
      await video.play();
      $('scan-frame').classList.add('is-detecting');
      $('camera-placeholder').classList.add('is-hidden');
      msg('scan-status', 'cameraStarted', 'success');
      frame();
    } catch (error) {
      msg('scan-status', error.name === 'NotAllowedError' ? 'cameraDenied' : 'cameraUnsupported', 'error');
    }
  }

  function frame() {
    const video = $('scan-video');
    if (!stream || !video) return;
    if (video.readyState >= 2 && !busy) {
      busy = true;
      if ('BarcodeDetector' in window) {
        new BarcodeDetector({ formats: ['qr_code'] })
          .detect(video)
          .then(found => { if (found[0] && found[0].rawValue) result(found[0].rawValue); })
          .catch(() => {})
          .finally(() => { busy = false; });
      }
      if (window.jsQR) {
        const canvas = $('scan-canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const found = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height, { inversionAttempts: 'dontInvert' });
        if (found && found.data) result(found.data);
      }
    }
    scanTimer = requestAnimationFrame(frame);
  }

  /* ---------------- a scan ----------------
     The page never decides whether a code is good. It asks the server and
     shows exactly what the server said, including whether the payment
     moved. */
  async function result(code) {
    stop();
    const box = $('scan-result');
    if (!box) return;
    box.replaceChildren();
    box.classList.remove('is-hidden');
    box.classList.remove('success');
    const heading = document.createElement('strong');
    heading.textContent = t('scanPending');
    box.append(heading);
    msg('scan-status', 'scanPending', '');

    let res = null;
    try {
      res = await KobeApi.agentScan(code);
    } catch (error) {
      res = { ok: false, error: (error && error.message) || t('scanFailed') };
    }

    box.replaceChildren();
    if (!res || res.ok === false) {
      heading.textContent = t('scanFailed');
      const detail = document.createElement('p');
      detail.textContent = (res && (res.error || res.reason)) || t('scanFailed');
      box.append(heading, detail);
      say('scan-status', detail.textContent, 'error');
      return;
    }

    heading.textContent = res.released
      ? t('scanReleased')
      : (res.release_scheduled_for ? t('scanWindow') : t('scanRecorded'));
    const detail = document.createElement('p');
    detail.textContent = [res.order_ref, res.item_name].filter(Boolean).join(' · ');
    box.append(heading, detail);
    box.classList.add('success');
    say('scan-status', heading.textContent, 'success');
    await refreshHub();
  }

  /* ---------------- the hub ---------------- */
  async function refreshHub() {
    if (!api() || typeof KobeApi.agentSnapshot !== 'function') return;
    let snapshot = null;
    try {
      snapshot = await KobeApi.agentSnapshot();
    } catch (error) {
      console.warn('agent snapshot', error);
    }
    if (!snapshot || snapshot.ok === false) {
      say('app-message', (snapshot && (snapshot.error || snapshot.reason)) || t('toolMessage'), 'error');
      show('app-message');
      return;
    }
    renderHub(snapshot);
  }

  function renderHub(snapshot) {
    $('agent-name').textContent = snapshot.worker_id || t('authorizedAgent');
    $('agent-meta').textContent = [snapshot.worker_id, snapshot.region].filter(Boolean).join(' · ');
    $('region-value').textContent = snapshot.region || '—';
    $('agent-role').textContent = snapshot.verified ? t('authorizedAgent') : (snapshot.verification_status || '—');
    scans = (snapshot.scans || []).map(scan => ({
      order_ref: scan.order_ref,
      item_name: scan.item_name,
      stage: scan.stage,
      time: scan.created_at ? new Date(scan.created_at).toLocaleString() : '',
    }));
    historyRender();
    const count = $('scan-count');
    if (count) count.textContent = String(snapshot.today_scans || 0);
    assignmentRender(snapshot.assignments || []);
  }

  async function hub(snapshot) {
    hide('auth-view');
    show('app-view');
    renderHub(snapshot || {});
    msg('app-message', 'signedIn', 'info');
    show('app-message');
    await loadNotifications();
  }

  /* ---------------- the small forms ---------------- */
  function openForm(title, fields, submitLabel, onSubmit) {
    const dialog = $('form-dialog');
    const body = $('form-body');
    $('form-dialog-title').textContent = title;
    $('form-submit').textContent = submitLabel;
    $('form-cancel').textContent = t('cancel');
    say('form-message', '', '');
    body.replaceChildren();

    fields.forEach(field => {
      if (field.note) {
        const note = document.createElement('p');
        note.className = 'tiny-note';
        note.textContent = field.note;
        body.append(note);
        return;
      }
      const label = document.createElement('label');
      label.setAttribute('for', 'field-' + field.key);
      label.textContent = field.label;
      const input = document.createElement('input');
      input.id = 'field-' + field.key;
      input.type = field.type || 'text';
      input.autocomplete = field.autocomplete || 'off';
      if (field.placeholder) input.placeholder = field.placeholder;
      body.append(label, input);
    });

    const submit = () => {
      const values = {};
      fields.forEach(field => {
        if (!field.key) return;
        const input = $('field-' + field.key);
        values[field.key] = input ? input.value.trim() : '';
      });
      Promise.resolve(onSubmit(values)).then(ok => {
        if (ok === false) return;
        dialog.close();
      }).catch(error => {
        say('form-message', (error && error.message) || t('toolMessage'), 'error');
      });
    };

    body.onsubmit = event => { event.preventDefault(); submit(); };
    $('form-submit').onclick = submit;
    dialog.showModal();
  }

  function openSecurityForm() {
    openForm(t('changePassword'), [
      { key: 'current', label: t('currentPassword'), type: 'password', autocomplete: 'current-password' },
      { key: 'next', label: t('newPassword'), type: 'password', autocomplete: 'new-password' },
      { key: 'confirm', label: t('confirmPassword'), type: 'password', autocomplete: 'new-password' },
    ], t('savePassword'), async values => {
      if (!values.current) throw new Error(t('currentPassword'));
      if (!values.next || values.next.length < 8) throw new Error(t('passwordError'));
      if (values.next !== values.confirm) throw new Error(t('confirmPassword'));
      const res = await KobeApi.passwordChange(values.current, values.next);
      if (!res || res.ok === false) throw new Error((res && (res.error || res.reason)) || t('toolMessage'));
      say('app-message', t('passwordChanged'), 'success');
      show('app-message');
    });
  }

  function openSupportForm() {
    openForm(t('help'), [
      { key: 'topic', label: t('supportTopic'), type: 'text' },
      { key: 'reason', label: t('supportMessage'), type: 'text' },
      { note: t('supportHint') },
    ], t('send'), async values => {
      if (!values.reason) throw new Error(t('supportMessage'));
      await KobeApi.supportRequest({
        topic: values.topic || 'Agent scan',
        current: null,
        proposed: values.reason,
        reason: values.reason,
      });
      say('app-message', t('supportSent'), 'success');
      show('app-message');
    });
  }

  /* ---------------- sign in ---------------- */
  $('signin-form').addEventListener('submit', async event => {
    event.preventDefault();
    const email = $('agent-email').value.trim();
    const password = $('password').value;
    if (!email || !/^\S+@\S+\.\S+$/.test(email)) { msg('auth-message', 'emailError', 'error'); return; }
    if (password.length < 8) { msg('auth-message', 'passwordError', 'error'); return; }

    const button = $('signin-form').querySelector('button[type="submit"]');
    const label = button ? button.textContent : '';
    if (button) { button.disabled = true; button.textContent = t('scanPending'); }
    try {
      const snapshot = await KobeApi.agentSignIn({ email, password });
      if (!snapshot || snapshot.ok === false) {
        say('auth-message', (snapshot && snapshot.error) || t('invalidPassword'), 'error');
        return;
      }
      await hub(snapshot);
    } catch (error) {
      say('auth-message', (error && error.message) || t('invalidPassword'), 'error');
    } finally {
      if (button) { button.disabled = false; button.textContent = label; }
    }
  });

  $('signout-btn').addEventListener('click', async () => {
    stop();
    hide('app-view');
    show('auth-view');
    $('password').value = '';
    scans = [];
    notifications = [];
    historyRender();
    notificationRender();
    try { await KobeApi.agentSignOut(); } catch (error) { console.warn('sign out', error); }
  });

  $('open-scan').addEventListener('click', () => {
    if (!navigator.onLine) { msg('app-message', 'offlineScan', 'error'); show('app-message'); return; }
    $('scan-dialog').showModal();
    $('scan-result').classList.add('is-hidden');
    $('scan-status').textContent = '';
    $('manual-code').value = '';
  });

  $('close-scan').addEventListener('click', () => { stop(); $('scan-dialog').close(); });
  $('start-camera').addEventListener('click', start);
  $('stop-camera').addEventListener('click', () => { stop(); msg('scan-status', 'cameraStopped', 'info'); });
  $('focus-scanner').addEventListener('click', () => { $('manual-code').focus(); msg('scan-status', 'scannerReady', 'info'); });

  $('manual-form').addEventListener('submit', event => {
    event.preventDefault();
    const code = $('manual-code').value.trim();
    if (!code) { msg('scan-status', 'invalidCode', 'error'); return; }
    result(code);
  });

  $('clear-history').addEventListener('click', () => { refreshHub(); loadNotifications(); });

  $('close-form').addEventListener('click', () => $('form-dialog').close());
  $('form-cancel').addEventListener('click', () => $('form-dialog').close());

  document.querySelectorAll('[data-tool]').forEach(button => {
    button.addEventListener('click', () => {
      const tool = button.dataset.tool;
      if (tool === 'notifications') {
        $('notification-title').scrollIntoView({ behavior: 'smooth', block: 'center' });
        loadNotifications();
        return;
      }
      if (tool === 'security') { openSecurityForm(); return; }
      if (tool === 'help') { openSupportForm(); return; }
      msg('app-message', 'toolMessage', 'info');
      show('app-message');
    });
  });

  addEventListener('offline', () => show('offline-banner'));
  addEventListener('online', () => hide('offline-banner'));
  addEventListener('beforeunload', stop);

  $('report-scan').addEventListener('click', () => {
    say('app-message', t('supportSent'), 'info');
    show('app-message');
  });

  if (!navigator.onLine) show('offline-banner');
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('agent-sw.js').catch(() => {});
  }
  apply();

  /* A session that is already open goes straight to the hub. */
  if (api() && typeof KobeApi.agentSnapshot === 'function') {
    KobeApi.agentSnapshot().then(snapshot => {
      if (snapshot && snapshot.ok !== false) hub(snapshot);
    }).catch(() => { /* stay on the sign-in form */ });
  }
})();
</script>
<script>
(() => {
  const input = document.getElementById('agent-avatar-input');
  const image = document.getElementById('agent-avatar-image');
  const initial = document.getElementById('agent-avatar-initial');
  const render = () => {
    let saved = '';
    try { saved = localStorage.getItem('kobe-agent-avatar') || ''; } catch (e) {}
    if (image) { image.src = saved; image.classList.toggle('is-visible', Boolean(saved)); }
    if (initial) initial.classList.toggle('is-hidden', Boolean(saved));
  };
  input?.addEventListener('change', () => {
    const file = input.files?.[0];
    if (!file || !/^image\/(png|jpeg|webp)$/.test(file.type)) return;
    const reader = new FileReader();
    reader.onload = () => {
      try { localStorage.setItem('kobe-agent-avatar', String(reader.result)); } catch (e) {}
      render();
    };
    reader.readAsDataURL(file);
  });
  render();
})();
</script></body>
</html>
