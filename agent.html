<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent — Kobe Mweusi</title>
  <style>
    :root {
      --bg: #0a1114;
      --panel: #121b1f;
      --panel-2: #182326;
      --line: #25373d;
      --text: #edf8f9;
      --muted: #a4b5ba;
      --green: #4dd0a1;
      --yellow: #f3c76d;
      --red: #ff7c72;
      --shadow: rgba(0,0,0,.28);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, Arial, sans-serif; }
    body { display: flex; min-height: 100vh; }

    .sidebar {
      width: 250px;
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 18px 14px;
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
      padding: 10px 8px 18px;
      border-bottom: 1px solid var(--line);
      letter-spacing: -0.04em;
    }

    .nav { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
    .nav button {
      width: 100%; text-align: left; background: transparent; color: var(--text);
      border: 1px solid transparent; border-radius: 10px; padding: 12px 10px;
      cursor: pointer; font-size: 14px;
    }
    .nav button:hover { background: rgba(255,255,255,0.02); border-color: var(--line); }
    .danger { color: var(--red); }

    .main { flex: 1; padding: 28px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .title { font-size: 30px; font-weight: 800; letter-spacing: -0.04em; }

    .grid {
      display: grid; grid-template-columns: repeat(3, minmax(180px, 1fr)); gap: 16px; margin-top: 16px;
    }

    .card {
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 12px 28px var(--shadow);
    }

    .label {
      color: var(--muted); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px;
    }

    .value {
      font-size: 30px; font-weight: 800; letter-spacing: -0.04em;
    }

    .row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid var(--line);
    }
    .row:last-child { border-bottom: none; }

    .badge {
      background: rgba(77, 208, 161, 0.12); color: var(--green);
      border: 1px solid rgba(77, 208, 161, 0.22);
      border-radius: 999px; padding: 5px 9px; font-size: 11px; font-weight: 700;
    }
    .badge.warn {
      background: rgba(243, 199, 109, 0.12); color: var(--yellow);
      border-color: rgba(243, 199, 109, 0.22);
    }

    @media (max-width: 860px) {
      body { display: block; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--line); }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">Kobe Mweusi</div>
    <nav class="nav">
      <button>Overview</button>
      <button>Assigned sellers</button>
      <button>Escrow checks</button>
      <button>Disputes</button>
      <button>Reports</button>
      <button>Messages</button>
      <button>Account settings</button>
      <button class="danger" id="logoutBtn">Log out</button>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="title">Agent dashboard</div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="label">Assigned sellers</div>
        <div class="value">46</div>
      </div>

      <div class="card">
        <div class="label">Escrow checks</div>
        <div class="value">19</div>
      </div>

      <div class="card">
        <div class="label">Open disputes</div>
        <div class="value">8</div>
      </div>
    </div>

    <div class="card" style="margin-top:22px;">
      <div class="label">Today’s queue</div>
      <div class="row">
        <span>Seller verification review</span>
        <span class="badge">Actioned</span>
      </div>
      <div class="row">
        <span>Escrow release check</span>
        <span class="badge warn">Waiting</span>
      </div>
      <div class="row">
        <span>Buyer dispute follow-up</span>
        <span class="badge">Review</span>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = 'https://YOUR_PROJECT_REF.supabase.co';
    const supabaseKey = 'YOUR_ANON_KEY';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    (async function () {
      const { data: { user }, error } = await supabase.auth.getUser();
      if (error || !user) {
        window.location.href = 'index.html';
        return;
      }

      const { data: profile } = await supabase
        .from('profiles')
        .select('role')
        .eq('id', user.id)
        .single();

      if (!profile || profile.role !== 'agent') {
        window.location.href = 'index.html';
      }
    })();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
