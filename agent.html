let lang='en',stream=null,scanTimer=null,busy=false,history=[],notifications=[];const $=id=>document.getElementById(id),t=k=>L[lang][k]||L.en[k]||k,show=id=>$(id).classList.remove('is-hidden'),hide=id=>$(id).classList.add('is-hidden');
function msg(id,key,tone){$(id).textContent=t(key);$(id).dataset.tone=tone||''}function notificationRender(){const list=document.getElementById("agent-notifications");if(!list)return;list.replaceChildren();if(!notifications.length){const e=document.createElement("p");e.className="empty-state";e.textContent="No notifications yet.";list.append(e)}notifications.forEach(n=>{const row=document.createElement("div"),icon=document.createElement("span"),body=document.createElement("span"),title=document.createElement("b"),detail=document.createElement("small");row.className="history-row";icon.className="history-icon";icon.textContent="!";title.textContent=n.title;detail.textContent=n.body+" · "+n.time;body.append(title,detail);row.append(icon,body);list.append(row)});const count=document.getElementById("notification-count");if(count)count.textContent=notifications.length+" new"}function notify(title,body){notifications.unshift({title:title,body:body,time:new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})});notificationRender()}function historyRender(){const list=$('history');list.replaceChildren();if(!history.length){const e=document.createElement('p');e.className='empty-state';e.textContent=t('noHistory');list.append(e)}history.forEach(x=>{const row=document.createElement('div'),ico=document.createElement('span'),text=document.createElement('span'),b=document.createElement('b'),s=document.createElement('small');row.className='history-row';ico.className='history-icon';ico.textContent='✓';b.textContent=t('scanLabel');s.textContent=x+' · '+t('timeNow');text.append(b,s);row.append(ico,text);list.append(row)});$('scan-count').textContent=history.length}

function result(code){stop();const box=$('scan-result');box.replaceChildren();const strong=document.createElement('strong'),p=document.createElement('p'),c=document.createElement('code');strong.textContent=t('scanPending');p.textContent=t('scanRecorded');c.textContent=String(code).slice(0,120);box.append(strong,p,c);box.classList.add('success');box.classList.remove('is-hidden');history.unshift(String(code).slice(0,32));historyRender();notify('Scan captured','Backend verification and seller payout are pending.');msg('scan-status','scanPending','success')}

async function hashPassword(value){const bytes=new TextEncoder().encode(value),digest=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(digest),x=>x.toString(16).padStart(2,'0')).join('')} $('signin-form').addEventListener('submit',async e=>{e.preventDefault();const id=$('worker-id').value.trim().toUpperCase(),pass=$('password').value;if(!/^KMW-[0-9]{2}[A-Z]{2}$/.test(id)){msg('auth-message','workerError','error');return}if(pass.length<8){msg('auth-message','passwordError','error');return}const key='kobe-agent-password:'+id,stored=localStorage.getItem(key),hashed=await hashPassword(pass);if(stored&&stored!==hashed){msg('auth-message','invalidPassword','error');return}if(!stored){localStorage.setItem(key,hashed);hub();msg('app-message','passwordSaved','success');show('app-message');return}hub()});$('signout-btn').addEventListener('click',()=>{stop();hide('app-view');show('auth-view');$('password').value='';});$('open-scan').addEventListener('click',()=>{if(!navigator.onLine){msg('app-message','offlineScan','error');show('app-message');return}$('scan-dialog').showModal();$('scan-result').classList.add('is-hidden');$('scan-status').textContent='';$('manual-code').value=''});$('close-scan').addEventListener('click',()=>{stop();$('scan-dialog').close()});$('start-camera').addEventListener('click',start);$('stop-camera').addEventListener('click',()=>{stop();msg('scan-status','cameraStopped','info')});$('focus-scanner').addEventListener('click',()=>{$('manual-code').focus();msg('scan-status','scannerReady','info')});$('manual-form').addEventListener('submit',e=>{e.preventDefault();const c=$('manual-code').value.trim();if(!c){msg('scan-status','invalidCode','error');return}result(c)});$('clear-history').addEventListener('click',()=>{history=[],notifications=[];historyRender()});document.querySelectorAll('[data-tool]').forEach(x=>x.addEventListener('click',()=>{msg('app-message','toolMessage','info');show('app-message')}));addEventListener('offline <script>
(() => {
  const input = document.getElementById('agent-avatar-input');
  const image = document.getElementById('agent-avatar-image');
  const initial = document.getElementById('agent-avatar-initial');
  const render = () => {
    let saved = '';
    try { saved = localStorage.getItem('kobe-agent-avatar') || ''; } catch (e) {}
    if (image) { image.src = saved; image.classList.toggle('is-visible', Boolean(saved)); }
    if (initial) initial.classList.toggle('is-hidden', Boolean(saved));
  };
  input?.addEventListener('change', () => {
    const file = input.files?.[0];
    if (!file || !/^image\/(png|jpeg|webp)$/.test(file.type)) return;
    const reader = new FileReader();
    reader.onload = () => {
      try { localStorage.setItem('kobe-agent-avatar', String(reader.result)); } catch (e) {}
      render();
    };
    reader.readAsDataURL(file);
  });
  render();
})();
</script></body>
