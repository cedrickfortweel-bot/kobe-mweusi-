<style>
:root{--bg:#14150F;--surface:#1D1F17;--line:#34362A;--shell:#C6903D;--text:#F2EFE4;--muted:#A6A491;--danger:#C4694A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}html{height:100%}
body{margin:0;min-height:100%;background:var(--bg) radial-gradient(ellipse at 20% -10%,rgba(198,144,61,.12),transparent 55%);color:var(--text);font-family:'Manrope',system-ui,sans-serif}
.wrap{max-width:440px;margin:0 auto;padding:28px 20px 50px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;text-decoration:none;color:var(--text)}.brand img{height:36px;width:auto;border-radius:0;display:block}.brand span{font:600 19px 'Fraunces',serif}
h1{font:600 26px/1.15 'Fraunces',serif;margin:0 0 10px}p.sub{color:var(--muted);font-size:15px;line-height:1.55;margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 22px}
label{display:block;font-size:13px;color:var(--muted);margin:16px 0 6px}label:first-of-type{margin-top:0}
input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 42px 12px 13px;color:var(--text);font:15px 'Manrope',sans-serif}
input:focus-visible{outline:2px solid var(--shell);outline-offset:1px;border-color:var(--shell)}input[aria-invalid=true]{border-color:var(--danger)}

.err{color:#E0896B;font-size:12.5px;margin-top:5px}.err:empty,.st:empty{display:none}.st{color:var(--danger);font-size:13.5px;margin-top:12px}
.ok{width:54px;height:54px;border-radius:50%;border:2px solid #6fd39a;color:#6fd39a;display:flex;align-items:center;justify-content:center;margin-bottom:16px}.ok svg{width:26px;height:26px}

function eye(i,b){const e=$(i),p=e.type==='password';e.type=p?'text':'password';b.setAttribute('aria-label',p?'Hide password':'Show password')}
function bad(i,m){$(i).setAttribute('aria-invalid',!!m);$(i+'-e').textContent=m||''}
document.addEventListener('input',e=>{if(e.target.id==='p1'||e.target.id==='p2')bad(e.target.id,'')});
function save(e){e.preventDefault();const a=$('p1').value,b=$('p2').value,st=e.target.querySelector('.st');st.textContent='';
bad('p1',a.length>=8?'':'Use at least 8 characters');bad('p2',a===b?'':'The passwords do not match');
if(a.length<8)return $('p1').focus(),false;if(a!==b)return $('p2').focus(),false;
if(demo&&!(window.KobeApi&&KobeApi.updatePassword)){st.textContent='Preview only. Nothing was saved.';return false}
const btn=e.target.querySelector('.btn');btn.disabled=true;
Promise.resolve(KobeApi.updatePassword(a)).then(()=>show('v-done')).catch(x=>{st.textContent=x.message||'Something went wrong. Try again.'}).finally(()=>btn.disabled=false);return false}
</script></body></html>
