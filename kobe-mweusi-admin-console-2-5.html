<style>
:root{--bg:#07130D;--sf:#0C1D14;--sf2:#112a1c;--bd:#1d3a29;--tx:#E8F3EC;--mu:#8FA99A;--pr:#4ADE80;--gold:#E3B341;--gr:#4ADE80;--am:#F5B942;--rd:#F0616D;--bl:#5AA9F0;--pu:#A78BFA;--r:10px}
[data-theme=light]{--bg:#F2F6F3;--sf:#fff;--sf2:#EAF2EC;--bd:#D5E3D9;--tx:#0B1F14;--mu:#4D6558;--pr:#15803D;--gold:#9A6B00;--gr:#15803D;--am:#B45309;--rd:#B91C1C;--bl:#1D4ED8;--pu:#6D28D9}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3{margin:0;font-weight:650}button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.btn{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:7px 12px}.btn:hover{border-color:var(--pr)}
.btn.p{background:var(--pr);color:#052E16;border-color:var(--pr);font-weight:650}.btn.d{border-color:var(--rd);color:var(--rd)}.btn.s{padding:3px 8px;font-size:12px}

/* ===== Humanized UI polish / accessibility ===== */

.ng{color:#777282}

 return`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Trend chart: ${a.length} points, latest ${tsh(a[a.length-1])}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ADE80" stop-opacity=".35"/><stop offset="1" stop-color="#4ADE80" stop-opacity="0"/></linearGradient></defs><path d="${L(pt(a))}L${w} ${h}L0 ${h}Z" fill="url(#${id})"/>${p?`<path d="${L(pt(p))}" fill="none" stroke="#8FA99A" stroke-dasharray="4 4"/>`:''}<path d="${L(pt(a))}" fill="none" stroke="#4ADE80" stroke-width="2.5"/></svg>`}
const pct=(a,b)=>((a-b)/b*100);
const trend=(v,good=1)=>{const up=v>=0,ok=up===!!good;return`<span class="${ok?'up':'dn'}">${up?'▲':'▼'} ${Math.abs(v).toFixed(1)}%</span>`};
const ring=(v,c='var(--pr)')=>`<div style="width:90px;height:90px;border-radius:50%;background:conic-gradient(${c} ${v*3.6}deg,var(--sf2) 0);display:grid;place-items:center" role="img" aria-label="${v}%"><div style="width:68px;height:68px;border-radius:50%;background:var(--sf);display:grid;place-items:center;font-weight:700">${v}%</div></div>`;
const stat=(l,v)=>`<div style="min-width:90px"><div class="sub">${esc(l)}</div><b>${esc(v)}</b></div>`;
const WR={
 volume:(d,s)=>({h:`<div class="row"><b class="kv">${tsh(d.t)}</b>${trend(pct(d.t,d.pt))}<span class="sub">vs ${tsh(d.pt)} previous</span></div>${area(d.s,s.cmp?d.p:null)}`,csv:[['point','volume'],...d.s.map((v,i)=>[i+1,v])]}),
 revenue:d=>({h:d.rows.map(r=>`<div class="row" style="justify-content:space-between"><span>${r[0]}</span><b class="${r[1]<0?'dn':''}">${tsh(Math.round(r[1]))}</b></div>`).join('')+`<hr style="border-color:var(--bd)"><div class="row" style="justify-content:space-between"><b>Net platform revenue</b><b class="up">${tsh(Math.round(d.net))}</b></div><p class="note">Customer funds (wallet and escrow liability) are not platform revenue.</p>`,csv:[['item','tsh'],...d.rows.map(r=>[r[0],Math.round(r[1])]),['Net',Math.round(d.net)]]}),
 funnel:d=>({h:d.f.map((f,i)=>`<a href="#/escrow" style="color:inherit;text-decoration:none"><div class="row" style="justify-content:space-between"><span>${f[0]}</span><b>${f[1]}%</b></div><div class="bar" style="margin-bottom:6px"><i style="width:${f[1]}%"></i></div></a>`).join(''),csv:[['stage','pct'],...d.f]}),
 payments:d=>({h:`<div class="tw"><table><tr><th>Provider</th><th>Txns</th><th>Success</th><th>Fail</th><th>Pending</th><th>Avg</th></tr>${d.p.map(p=>`<tr><td><a href="#/payments" style="color:var(--pr)">${p[0]}</a></td><td>${p[1]}</td><td>${p[2]}%</td><td class="dn">${p[3]}%</td><td>${p[4]}%</td><td>${p[5]}</td></tr>`).join('')}</table></div><p class="sub">Top failure reasons</p>${d.why.map(w=>`<div class="row" style="justify-content:space-between"><a href="#/payments" style="color:inherit">${w[0]}</a><b>${w[1]}%</b></div>`).join('')}`,csv:[['provider','txns','success','fail','pending','avg'],...d.p]}),
 days:d=>{const mx=Math.max(...d.v),hi=d.v.indexOf(mx);return{h:`<div class="cols" role="img" aria-label="Most active day: ${d.d[hi]}">${d.v.map((v,i)=>`<div class="${i===hi?'hi':''}"><b style="height:${v/mx*90}px"></b>${d.d[i]}</div>`).join('')}</div><p class="sub">Highest: ${d.d[hi]} (${mx} transactions)</p>`,csv:[['day','transactions'],...d.d.map((x,i)=>[x,d.v[i]])]}},
 users:d=>({h:`<div class="kv">${d.t.toLocaleString()}</div><div class="row">${d.seg.map(s=>stat(s[0],s[1].toLocaleString())).join('')}</div><hr style="border-color:var(--bd)"><div class="row">${d.st.map(s=>stat(s[0],s[1].toLocaleString())).join('')}</div>`,csv:[['segment','count'],...d.seg]}),
 repeat:d=>({h:`<div class="row">${ring(d.v)}<div><div class="sub">Target ${d.t}%</div>${stat('Repeat buyers',d.rb)}${stat('First-time buyers',d.fb)}${stat('Returning sellers',d.rs)}</div></div>`,csv:[['rate','target'],[d.v,d.t]]}),
 sellers:d=>({h:`<div class="tw"><table><tr><th>Seller</th><th>Volume</th><th>Done</th><th>Rating</th></tr>${d.rows.map(s=>`<tr><td><a href="#/sellers" style="color:var(--pr)">@${s.username}</a></td><td>${tsh(s.volume)}</td><td>${s.completion}%</td><td>★ ${s.rating}</td></tr>`).join('')}</table></div>`,csv:[['seller','volume'],...d.rows.map(s=>[s.username,s.volume])]}),
 hubs:d=>({h:`<div class="tw"><table><tr><th>Hub</th><th>Received</th><th>Ready</th><th>Pickups</th><th>Overdue</th><th>Avg pickup</th></tr>${d.rows.map(h=>`<tr><td>${h.hub}</td><td>${h.received}</td><td>${h.ready}</td><td>${h.pickups}</td><td class="dn">${h.overdue}</td><td>${h.avgPickup}</td></tr>`).join('')}</table></div>`,csv:[['hub','received','overdue'],...d.rows.map(h=>[h.hub,h.received,h.overdue])]}),
 ops:d=>({h:[['Customer care',d.care],['KYC',d.kyc],['Disputes',d.disp],['Risk',d.risk]].map(g=>`<p class="sub" style="margin:6px 0 2px">${g[0]}</p><div class="row">${g[1].map(s=>stat(s[0],s[1])).join('')}</div>`).join(''),csv:[['group','metric','value'],...[['care',d.care],['kyc',d.kyc]].flatMap(g=>g[1].map(s=>[g[0],...s]))]}),
 intel:d=>({h:d.i.map(x=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--bd);padding:6px 0"><span style="max-width:80%">${x}</span><a class="btn s" href="#/analytics">View details</a></div>`).join(''),csv:[['insight'],...d.i.map(x=>[x])]}),
 health:d=>({h:d.h.map(x=>`<div class="hrow"><span>${x[0]}</span>${badge(x[1])}<span class="sub">${x[2]}</span></div>`).join(''),csv:[['service','status','metric','uptime'],...d.h]})

function probApply(a){const p=prs.find(x=>x.emp===a.forId),o=a.apply.decision,prev=p.status;p.status=o;p.decision=o;p.empStatus=o==='Confirmed'?'Confirmed':o==='Extended'?'On Probation':'Not Confirmed';if(o==='Extended'){const d=new Date(p.end);d.setDate(d.getDate()+90);p.ext=d.toISOString().slice(0,10)}
 p.hist.push({ts:now(),by:cur.name,act:'Decision approved: '+o,note:'Approval '+a.id});note(p.emp,`Your probation outcome: ${o}.`,'Probation');note('KMW-004',`${nm(p.emp)} probation approved as ${o}. Issue the letter.`,'Probation');aud(cur,'Probation updated','probation',p.emp,prev,o,'Approval '+a.id,'High');
 if(o==='Not Confirmed'){aps.push({id:'APR-'+(1000+aps.length+1),type:'System access change',forId:p.emp,by:cur.id,dept:p.dept,sub:now().slice(0,10),status:'Approved',level:'CEO',reason:'Disable account after approved non-confirmation.',hist:[{ts:now(),by:cur.name,role:cur.role,act:'Approve',note:'Follows approval '+a.id}],apply:{kind:'disable',uid:p.emp}});note('KMW-001','Pending task: disable the account of '+nm(p.emp),'Access')}}
function probView(p){const me=cur,self=me.id===p.emp,isMgr=me.id===p.mgr||me.role==='Super Admin'||(me.role==='Department Head'&&me.dept===p.dept),hr=['HR Manager','Super Admin'].includes(me.role),fin=['Confirmed','Extended','Not Confirmed'].includes(p.status);
 let h=`<h3>${esc(nm(p.emp))} · ${esc(p.title)}</h3><p>${badge(p.status)} ${p.dept} · manager ${esc(nm(p.mgr))}</p><p class="sub">Start ${p.start} · end ${p.end}${p.ext?' · extended to '+p.ext:''} · review ${p.review}</p><h3 style="margin-top:8px">Goals</h3><div>${p.kpis.map(k=>`<span class="chip">${esc(k)}</span>`).join('')}</div>`;
 if(!self||fin){h+=`<p style="margin-top:8px">Attendance: ${esc(p.att)}<br>Conduct: ${esc(p.conduct)}<br>Rating: ${p.rating??'—'} · Recommendation: ${p.rec||'—'}</p><p class="sub">Manager: ${esc(p.mgrNote||'—')}<br>HR: ${esc(p.hrNote||'—')}</p>`}else h+='<p class="note" style="margin-top:8px">Reviews stay private until the final outcome is approved.</p>';
 h+=`<h3>Timeline</h3><div class="tl">${p.hist.map(x=>`<div><b>${esc(x.act)}</b> · ${x.ts} · ${esc(x.by)}<br><span class="sub">${esc(x.note)}</span></div>`).join('')}</div><div class="row" id="pa" style="margin-top:8px"></div>`;const o=modal(h),A=$('#pa',o),add=(l,f,c='')=>{const b=document.createElement('button');b.className='btn '+c;b.textContent=l;b.onclick=()=>{o.close();f()};A.append(b)};
 if(self){A.innerHTML='<span class="mu">You can view your own dates, goals and the final outcome. You cannot change them.</span>';return}
 if(isMgr&&p.status==='Pending Manager Review')add('Complete evaluation',()=>dlg('Evaluation and recommendation',`<label for="rt">Performance rating (1-5)</label><input id="rt" type="number" min="1" max="5" value="4"><label for="rc">Recommendation</label><select id="rc"><option>Confirm</option><option>Extension</option><option>Not Confirm</option></select>`,'Submit to HR',(r)=>{const v=+$('#rt').value;if(!(v>=1&&v<=5))return bad('Rating must be 1 to 5.');p.rating=v;p.rec=$('#rc').value;p.mgrNote=r;p.status='Pending HR Review';p.hist.push({ts:now(),by:me.name,act:'Manager recommends: '+p.rec,note:r});note('KMW-004',`${nm(p.emp)}: manager evaluation submitted (${p.rec}).`,'Probation');aud(me,'Probation updated','probation',p.emp,'Pending Manager Review','Pending HR Review',r,'Medium');save();rerender()}),'p');
 if(hr&&p.status==='Pending HR Review'){add('Return to manager',()=>dlg('Return to manager',`<p class="sub">Say what is missing.</p>`,'Return',(r)=>{p.status='Pending Manager Review';p.hrNote=r;p.hist.push({ts:now(),by:me.name,act:'HR returned to manager',note:r});note(p.mgr,`${nm(p.emp)}: HR needs more information.`,'Probation');aud(me,'Returned','probation',p.emp,'Pending HR Review','Pending Manager Review',r);save();rerender()}));
  add('Submit to CEO',()=>dlg('Submit for executive approval',`<p class="sub">Recommendation: ${p.rec}. HR reviewed attendance, conduct and documents.</p>`,'Submit',(r)=>{p.status='Pending CEO Approval';p.hrNote=r;const id='APR-'+(1000+aps.length+1),sen=['Department Head'].includes(U(p.emp)?.role);p.ap=id;aps.push({id,type:'Probation '+(p.rec==='Confirm'?'confirmation':p.rec==='Extension'?'extension':'non-confirmation'),forId:p.emp,by:me.id,dept:p.dept,sub:now().slice(0,10),status:'Submitted',level:sen?'Super Admin':'CEO',reason:`HR recommends: ${p.rec}. ${r}`,hist:[],apply:{kind:'prob',decision:OUT[p.rec]}});p.hist.push({ts:now(),by:me.name,act:'HR submitted to CEO',note:r});note('KMW-001',`New approval ${id}: probation for ${nm(p.emp)}.`);aud(me,'Submitted','probation',p.emp,'Pending HR Review','Pending CEO Approval',r,'Medium',id);save();rerender()}),'p')}
 if(hr&&fin&&!p.letter)add('Record letter issued',()=>dlg('Record the letter',`<p class="sub">Outcome: ${p.status}.</p>`,'Record',(r)=>{p.letter=true;p.hist.push({ts:now(),by:me.name,act:'Letter issued',note:r});note(p.emp,'Your probation letter was issued.','Probation');aud(me,'Updated','probation',p.emp,'No letter','Letter issued',r);save();rerender()}));
 if(me.role==='Super Admin'&&p.status!=='Pending Manager Review')add('Override decision',()=>dlg('Super Admin override',`<label for="oo">New outcome</label><select id="oo"><option>Confirmed</option><option>Extended</option><option>Not Confirmed</option></select>`,'Override',(r)=>{const prev=p.status;p.status=p.decision=$('#oo').value;p.empStatus=p.status==='Confirmed'?'Confirmed':p.status==='Extended'?'On Probation':'Not Confirmed';p.hist.push({ts:now(),by:me.name,act:'Super Admin override: '+p.status,note:r});note(p.emp,'Your probation outcome was updated: '+p.status,'Probation');aud(me,'Probation updated','probation',p.emp,prev,p.status,r,'High');save();rerender()},true,true),'d');
 if(!A.children.length)A.innerHTML=`<span class="mu">No action for your role at this stage.</span>`}
function probation(ct){const R=prs.filter(p=>can('probation')&&(cur.role==='Employee'?p.emp===cur.id:cur.role==='Team Lead'?p.mgr===cur.id:cur.role==='Department Head'?p.dept===cur.dept:true));
 ct.innerHTML=hdr('Probation & Performance')+kpiStrip([['Records',R.length],['Awaiting manager',R.filter(p=>p.status==='Pending Manager Review').length],['Awaiting HR',R.filter(p=>p.status==='Pending HR Review').length],['Awaiting CEO',R.filter(p=>p.status==='Pending CEO Approval').length]])+`<div class="card"><div class="tw"><table><thead><tr><th>Employee</th><th>Title</th><th>Department</th><th>Manager</th><th>End</th><th>Employee status</th><th>Probation status</th><th></th></tr></thead><tbody>${R.map(p=>`<tr><td>${esc(nm(p.emp))}</td><td>${esc(p.title)}</td><td>${p.dept}</td><td>${esc(nm(p.mgr))}</td><td>${p.ext||p.end}</td><td>${badge(p.empStatus)}</td><td>${badge(p.status)}</td><td><button class="btn s" data-p="${p.emp}">Open</button></td></tr>`).join('')||'<tr><td colspan="8" class="mu">No probation records for your role.</td></tr>'}</tbody></table></div></div><p class="note" style="margin-top:10px">Reminders are due at 30, 14, 7, 3 and 1 day before the end date. In this prototype they appear as bell notifications.</p>`;$$('[data-p]',ct).forEach(b=>b.onclick=()=>probView(prs.find(p=>p.emp===b.dataset.p)))}

function access(ct){const hr=['HR & People Manager','Super Admin'].includes(cur.role),sa=cur.role==='Super Admin',top=['Super Admin','CEO'].includes(cur.role);
 ct.innerHTML=hdr('User Access','<button class="btn p" id="nu">+ Create account</button>')+`<div class="card"><div class="tw"><table><thead><tr><th>ID</th><th>Name</th><th>Role</th><th>Status</th><th>MFA</th><th>Failed</th><th>Last login</th><th>Actions</th></tr></thead><tbody>${users.map(u=>`<tr><td>${u.id}</td><td>${esc(u.name)}</td><td>${esc(roleLabel(u))}</td><td>${badge(u.status)}</td><td>${badge(u.mfa)}</td><td>${u.fails}</td><td>${u.last}</td><td>${u.status==='Locked'&&(sa||top)?`<button class="btn s" data-u="${u.id}|unlock">Unlock</button>`:''}${(sa||top)&&u.id!==cur.id&&u.status!=='Locked'?`<button class="btn s" data-u="${u.id}|reset">Reset password</button>`:''}${(hr||top)&&u.id!==cur.id&&u.status==='Active'?`<button class="btn s d" data-u="${u.id}|suspend">Request suspension</button>`:''}${(hr||top)&&u.id!==cur.id&&u.role!=='Super Admin'&&u.status==='Active'?`<button class="btn s" data-u="${u.id}|role">Change role</button>`:''}</td></tr>`).join('')}</tbody></table></div></div><p class="note" style="margin-top:10px">Super Admin applies suspensions only after approval. Roles change only through HR (with Super Admin & CEO approval) or by the Super Admin & CEO directly. Nobody can read or set another person's password.</p>`;
 $('#nu').onclick=()=>{if(!(sa||hr||top))return toast('Your role cannot create accounts.');dlg('Create account',`<label for="ni">Employee ID</label><input id="ni" placeholder="KMW-040"><label for="nn">Full name</label><input id="nn"><label for="nr">Role</label><select id="nr">${['Employee','HR & People Manager','Finance Manager','Operations Manager','Trust & Safety Manager','Customer Support Manager','IT & Security Manager'].map(r=>`<option>${r}</option>`).join('')}</select>`,'Create',(r)=>{const id=$('#ni').value.trim().toUpperCase(),n=$('#nn').value.trim();if(!/^KMW-\d{3}$/.test(id)||!n||U(id))return bad('Enter a new Employee ID like KMW-040 and a name.');if(!sa)return bad('Only Super Admin creates accounts, after the access request is approved.');const t=TEMP;hx(0).then(async()=>{const s=slt();users.push({id,name:n,role:$('#nr').value,dept:'Unassigned',email:emailOf(n,'x'),status:'Pending Activation',mfa:'Setup Required',fails:0,salt:s,hash:await hx(s+t),force:true,last:'—',created:now(),createdBy:cur.id,hist:[]});aud(cur,'Created','user',id,'—','Pending Activation',r,'Medium');save();toast(`Account ${id} created. The worker must choose a new password at first sign-in.`);rerender()})})};

 const o=modal(`<h3>${m?'Reply':'New email'}</h3>${m?'':`<label for="cf">From</label><select id="cf">${boxes.map(b=>`<option value="${b.id}">${esc(b.addr)}</option>`).join('')}</select>`}<label for="ct2">To</label><input id="ct2" value="${m?esc(m.from):''}" ${m?'readonly':''}><label for="cs">Subject</label><input id="cs" value="${m?esc('Re: '+m.subject.replace(/^Re: /,'')):''}"><label for="ctp">Quick reply</label><select id="ctp"><option value="">Choose a template…</option>${TPL.map((t,i)=>`<option value="${i}">${esc(t[0])}</option>`).join('')}</select><label for="cb">Message</label><textarea id="cb" rows="8"></textarea><p id="cer" class="note" style="display:none;border-color:var(--rd);color:var(--rd)"></p><div class="row" style="margin-top:12px"><button class="btn p" id="csend">Send</button><button class="btn" id="ccancel">Cancel</button></div><p class="sub" style="margin-top:8px">Demo: no real email is sent.</p>`);
 $('#ctp',o).onchange=e=>{const t=TPL[e.target.value];if(t)$('#cb',o).value=t[1].replace('{n}',first||'there')};$('#ccancel',o).onclick=o.close;
 $('#csend',o).onclick=()=>{const to=$('#ct2',o).value.trim(),su=$('#cs',o).value.trim(),b=$('#cb',o).value.trim(),er=$('#cer',o);const bad=t=>{er.textContent=t;er.style.display='block'};
  if(!/^\S+@\S+\.\S+$/.test(to))return bad('Enter a valid email address.');if(!su)return bad('Add a subject.');if(!b)return bad('Write a message first.');
  if(m){m.replies.push({name:u.name,ts:nowS(),text:b});if(!m.assignee)m.assignee=u.id;send({to,subject:su,id:m.id})}else send({to,subject:su});
  o.close();toast('Email sent (demo: nothing left this browser).');route()}}
function wire(ct){const u=cu(),m=V.tab==='log'?null:M.find(x=>x.id===sel),sv2=()=>{store.set('kmos_mailview',V)},re=()=>{sv();sv2();route()};

 const on=(id,fn)=>{const e=$(id,ct);if(e)e.onclick=fn};on('#mnew',()=>compose(null));

 on('#mdone',()=>{const was=m.status;m.status=was==='Done'?'Open':'Done';KM.aud(u,'Email '+(m.status==='Done'?'marked done':'reopened'),'email',m.id,was,m.status,m.subject,'Low');re()});
 on('#mlinks',()=>{m.link=$('#mlink',ct).value.trim().toUpperCase().slice(0,20);re()});

 return`<div class="card"><h3>You don't have access to ${esc(t)}</h3><p class="sub">Your role (${esc(u?.role||'')}) does not include it. Nothing is wrong with your account.</p><p style="margin-top:8px">If you need it for your work, send a request. Your Super Admin or IT &amp; Security Manager will see it. <a href="#/dashboard">Back to your dashboard</a></p><button class="btn p" id="reqacc" style="margin-top:10px">Request access</button></div>`};

 else if(e.key==='g'){g=Date.now()}else if(GO[e.key]&&Date.now()-g<1200){g=0;KM.can(GO[e.key])?location.hash='#/'+GO[e.key]:toast('Your role does not include that page.')}});
